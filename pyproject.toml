[project]
name = "ricelang"
version = "0.3.0"
description = "Language identification and tokenization for Southeast Asian languages (Burmese, Karen variants, Chin variants, Eastern Kayah, Shan)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kaung Htet San", email = "kaung@htetsan.me" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "fasttext-wheel>=0.9.2",
    "numpy<2",
    "python-crfsuite>=0.9.9",
    "tokenizers>=0.22.2",
]

[project.urls]
Homepage = "https://github.com/kaunghtetsan275/ricelang"
Repository = "https://github.com/kaunghtetsan275/ricelang"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ricelang"]

[tool.hatch.build.targets.wheel.force-include]
"ricelang/model/pdsdetect.ftz" = "ricelang/model/pdsdetect.ftz"
"ricelang/model/tokenizer.crfsuite" = "ricelang/model/tokenizer.crfsuite"
"ricelang/model/bpe.json" = "ricelang/model/bpe.json"

[tool.hatch.build.targets.sdist]
include = ["ricelang", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.14.3",
    "pytest>=8",
    "requests>=2.32.5",
    "ruff>=0.6",
]
