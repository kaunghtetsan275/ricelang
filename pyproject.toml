[project]
name = "pyidaungsu"
version = "0.2.0"
description = "Python library for Myanmar language NLP (Burmese, Karen, Mon, Shan)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kaung Htet San", email = "kaung@htetsan.me" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "fasttext-wheel>=0.9.2",
    "numpy<2",
    "python-crfsuite>=0.9.9",
]

[project.urls]
Homepage = "https://github.com/kaunghtetsan275/pyidaungsu"
Repository = "https://github.com/kaunghtetsan275/pyidaungsu"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyidaungsu"]

[tool.hatch.build.targets.wheel.force-include]
"pyidaungsu/model/pdsdetect.ftz" = "pyidaungsu/model/pdsdetect.ftz"
"pyidaungsu/model/tokenizer.crfsuite" = "pyidaungsu/model/tokenizer.crfsuite"

[tool.hatch.build.targets.sdist]
include = ["pyidaungsu", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.14.3",
    "pytest>=8",
    "requests>=2.32.5",
    "ruff>=0.6",
]
