[project]
name = "ricelang"
version = "0.4.2"
description = "Language identification and tokenization for Southeast Asian languages (Burmese, Karen variants, Chin variants, Eastern Kayah, Shan, etc.) — also exposes a `ricelang` CLI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kaung Htet San", email = "kaung@htetsan.me" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "fasttext-wheel>=0.9.2",
    "numpy<2",
    "python-crfsuite>=0.9.9",
    "tokenizers>=0.22.2",
]

[project.scripts]
ricelang = "ricelang.cli:main"

[project.urls]
Homepage = "https://github.com/kaunghtetsan275/ricelang"
Repository = "https://github.com/kaunghtetsan275/ricelang"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ricelang"]

[tool.hatch.build.targets.wheel.force-include]
"ricelang/model/pdsdetect.ftz" = "ricelang/model/pdsdetect.ftz"
"ricelang/model/tokenizer.crfsuite" = "ricelang/model/tokenizer.crfsuite"
"ricelang/model/bpe_cfm.json" = "ricelang/model/bpe_cfm.json"
"ricelang/model/bpe_cnh.json" = "ricelang/model/bpe_cnh.json"
"ricelang/model/bpe_ctd.json" = "ricelang/model/bpe_ctd.json"
"ricelang/model/bpe_eky.json" = "ricelang/model/bpe_eky.json"
"ricelang/model/bpe_eng.json" = "ricelang/model/bpe_eng.json"
"ricelang/model/bpe_hin.json" = "ricelang/model/bpe_hin.json"
"ricelang/model/bpe_khm.json" = "ricelang/model/bpe_khm.json"
"ricelang/model/bpe_ksw.json" = "ricelang/model/bpe_ksw.json"
"ricelang/model/bpe_kvq.json" = "ricelang/model/bpe_kvq.json"
"ricelang/model/bpe_lao.json" = "ricelang/model/bpe_lao.json"
"ricelang/model/bpe_msa.json" = "ricelang/model/bpe_msa.json"
"ricelang/model/bpe_mya.json" = "ricelang/model/bpe_mya.json"
"ricelang/model/bpe_multi.json" = "ricelang/model/bpe_multi.json"
"ricelang/model/bpe_pwo.json" = "ricelang/model/bpe_pwo.json"
"ricelang/model/bpe_shn.json" = "ricelang/model/bpe_shn.json"
"ricelang/model/bpe_tam.json" = "ricelang/model/bpe_tam.json"
"ricelang/model/bpe_tgl.json" = "ricelang/model/bpe_tgl.json"
"ricelang/model/bpe_tha.json" = "ricelang/model/bpe_tha.json"
"ricelang/model/bpe_vie.json" = "ricelang/model/bpe_vie.json"
"ricelang/model/bpe_zho.json" = "ricelang/model/bpe_zho.json"
"ricelang/model/bpe_ban.json" = "ricelang/model/bpe_ban.json"
"ricelang/model/bpe_hnn.json" = "ricelang/model/bpe_hnn.json"
"ricelang/model/bpe_kac.json" = "ricelang/model/bpe_kac.json"
"ricelang/model/bpe_mnw.json" = "ricelang/model/bpe_mnw.json"
"ricelang/model/bpe_sun.json" = "ricelang/model/bpe_sun.json"

[tool.hatch.build.targets.sdist]
include = ["ricelang", "README.md", "LICENSE"]

[dependency-groups]
demo = [
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
]
dev = [
    "beautifulsoup4>=4.14.3",
    "mwparserfromhell>=0.7.2",
    "pytest>=8",
    "requests>=2.32.5",
    "ruff>=0.6",
]
