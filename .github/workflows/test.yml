name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.13 excluded for now: fasttext-wheel 0.9.2 has no 3.13 Linux
        # wheel and the from-source build fails on newer GCC.
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: set up python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: check uv lockfile
        run: uv lock --check
      - name: sync (dev + demo)
        run: uv sync --locked --group dev --group demo --python ${{ matrix.python }}
      - name: ruff
        run: uv run --locked --python ${{ matrix.python }} ruff check .
      - name: pytest
        run: uv run --locked --python ${{ matrix.python }} pytest -q

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - name: set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: test
        run: pnpm test
      - name: build
        run: pnpm run build
