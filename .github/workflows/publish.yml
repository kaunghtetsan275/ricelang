name: publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # for creating the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # need history for changelog

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: build wheel + sdist
        run: |
          uv build
          ls -lh dist/

      - name: sanity-check version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(uv run --no-sync python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          echo "tag=$TAG  package=$PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG does not match pyproject version $PKG_VERSION"
            exit 1
          fi

      - name: publish to PyPI
        env:
          UV_PUBLISH_USERNAME: __token__
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*

      - name: build release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF}^" 2>/dev/null || echo "")
          {
            echo "## Changes"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "Commits since \`$PREV_TAG\`:"
              echo ""
              git log --pretty=format:"- %s (%h)" "$PREV_TAG..${GITHUB_REF}"
              echo ""
              echo ""
              echo "**Full diff:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${GITHUB_REF#refs/tags/}"
            else
              echo "Initial release."
            fi
            echo ""
            echo "## Install"
            echo '```sh'
            echo "pip install --upgrade ricelang"
            echo "# or"
            echo "uv add ricelang@${GITHUB_REF#refs/tags/v}"
            echo '```'
          } > release_notes.md
          cat release_notes.md

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          make_latest: "true"
